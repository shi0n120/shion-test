<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#160b0e"><title>紫音といっしょ。</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body>
<div id="app"><header><button class="back hidden" id="back">‹</button><div><h1 id="title">紫音といっしょ。</h1><p id="hello">おかえり。</p></div></header><main>
<section id="home" class="page active"><div class="home-buttons"><button data-go="schedule">スケジュール</button><button data-go="attendance">勤怠</button><button data-go="settings">設定</button></div><img class="shion" src="assets/shion.png" alt="紫音とカラス"></section>
<section id="schedule" class="page"><div class="cal-head"><button id="prevMonth">‹</button><strong id="monthLabel"></strong><button id="nextMonth">›</button></div><div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendar" class="calendar"></div><div class="row"><button id="todoOpen">ToDo リスト</button><button id="eventAdd">＋ 予定</button></div><div id="dayPlans" class="card"></div></section>
<section id="attendance" class="page"><div class="shion-att-wrap"><img class="shion-att" src="assets/shion.png" alt="紫音とカラス"><div id="speech" class="speech">今日も一緒に。</div></div><div id="todayStatus" class="today-status"></div><div class="punch"><button id="clockIn">出勤</button><button id="clockOut">退勤</button><button id="dayOff">お休み</button></div><div id="attSummary" class="card"></div><button id="historyOpen" class="wide-button">勤務履歴を見る ›</button></section>
<section id="attendanceHistory" class="page"><div class="history-month"><button id="histPrev">‹</button><strong id="histMonthLabel"></strong><button id="histNext">›</button></div><div id="histSummary" class="card"></div><div id="historyList" class="history-list"></div><button id="manualAdd" class="wide-button">＋ 勤務記録を追加</button></section>
<section id="settings" class="page"><div class="card form"><label>ユーザー名<input id="userName" placeholder="お名前"></label><label>背景画像<input id="bgFile" type="file" accept="image/*"></label><button id="resetBg">背景を初期化</button><hr><button id="exportBtn">バックアップを書き出す</button><label class="import">バックアップから復元<input id="importFile" type="file" accept="application/json"></label><p class="small">データはこのブラウザ内に保存されます。</p></div></section>
<section id="todos" class="page"><div class="row"><button id="todoAdd">＋ ToDo</button></div><div id="todoList" class="card"></div></section>
</main></div>
<dialog id="editor"><form method="dialog" id="editorForm"><h2 id="editorTitle">予定</h2><input id="editId" type="hidden"><label>タイトル<input id="editText" required></label><label id="dateLabel">日付<input id="editDate" type="date"></label><label id="timeLabel">時間<input id="editTime" type="time"></label><label id="deadlineLabel" class="hidden">期限<input id="editDeadline" type="date"></label><menu><button value="cancel">キャンセル</button><button id="deleteItem" value="delete" class="danger">削除</button><button id="saveItem" value="default">保存</button></menu></form></dialog>
<dialog id="attEditor"><form method="dialog" id="attEditorForm"><h2>勤務記録</h2><input id="attEditId" type="hidden"><label>日付<input id="attEditDate" type="date" required></label><label>区分<select id="attEditType"><option value="work">出勤</option><option value="off">お休み</option></select></label><div id="workFields"><label>出勤時刻<input id="attEditIn" type="time"></label><label>退勤時刻<input id="attEditOut" type="time"></label><label>休憩時間（分）<input id="attEditBreak" type="number" min="0" step="1" value="0"></label></div><menu><button value="cancel">キャンセル</button><button id="attDelete" value="delete" class="danger">削除</button><button id="attSave" value="default">保存</button></menu></form></dialog>
<script src="app.js"></script></body></html>
